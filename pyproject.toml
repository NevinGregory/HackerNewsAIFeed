[project]
name = "hn-ai-feed"
version = "0.1.0"
description = "Convert Hacker News front page stories into AI-generated TikTok-style videos with Minecraft parkour backgrounds."
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12",
  "click>=8.1.0",
  "elevenlabs>=2.0.0",
  "google-genai>=2.8.0",
  "google-genai>=1.0",
  "moviepy>=2.1.0",
  "openai>=1.0.0",
  "pillow>=10.0",
  "python-dotenv>=1.0.0",
  "requests>=2.31.0",
  "trafilatura>=1.12.0",
  "yt-dlp>=2024.0",
]

[project.scripts]
hn-feed = "src.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
